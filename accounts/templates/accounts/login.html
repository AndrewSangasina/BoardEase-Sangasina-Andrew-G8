{% extends "accounts/base.html" %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-box-arrow-in-right display-5 text-primary"></i>
          <h4 class="mt-2 mb-0">Welcome back</h4>
          <p class="text-muted small">Log in to your BoardEase account</p>
        </div>
        {% if form.errors %}
          <div class="alert alert-danger py-2">Invalid username or password.</div>
        {% endif %}
        <form method="post">
          {% csrf_token %}
          {% for field in form %}
            <div class="mb-3">
              <label for="{{ field.id_for_label }}" class="form-label fw-semibold">{{ field.label }}</label>
              {{ field }}
            </div>
          {% endfor %}
          <button class="btn btn-primary w-100">Log in</button>
        </form>
        <p class="text-center mt-3 mb-0 small">No account? <a href="{% url 'register' %}">Register</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
