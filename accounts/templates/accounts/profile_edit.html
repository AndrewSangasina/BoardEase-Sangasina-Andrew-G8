{% extends "accounts/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-white fw-bold py-3">Edit Profile</div>
      <div class="card-body p-4">
        <div class="text-center mb-4">
          {% if user.profile_photo %}
            <img src="{{ user.profile_photo.url }}" class="avatar" alt="Profile photo">
          {% else %}
            <div class="avatar-initial">{{ user.username|slice:":1"|upper }}</div>
          {% endif %}
        </div>
        <form method="post" enctype="multipart/form-data">
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary flex-fill"><i class="bi bi-check2 me-1"></i>Save changes</button>
            <a class="btn btn-outline-secondary flex-fill" href="{% url 'profile' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
