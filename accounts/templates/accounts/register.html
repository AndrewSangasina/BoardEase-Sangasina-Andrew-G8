{% extends "accounts/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4">
        <div class="text-center mb-3">
          <i class="bi bi-person-plus display-5 text-primary"></i>
          <h4 class="mt-2 mb-0">Create an account</h4>
        </div>
        <form method="post">
          {% csrf_token %}
          {% include "accounts/_form_fields.html" %}
          <button class="btn btn-primary w-100">Register</button>
        </form>
        <p class="text-center mt-3 mb-0 small">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
